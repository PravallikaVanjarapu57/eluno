# Render blueprint: a single free web service (Docker) serving the UI and the API on one origin.
# The mock and the SQLite file live in the container's ephemeral disk and reset together on restart/redeploy.
services:
  - type: web
    name: eluno-till
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MOCK_FLAKE   # set to "1" to make the mock return random 429/503, like the live assessment
        value: "0"
