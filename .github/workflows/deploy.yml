name: Build and deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a deploy that is still waiting; never cancel one that is already running.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pravallikavanjarapu57/eluno-till   # must be lower-case

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to GHCR with the built-in GITHUB_TOKEN

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: pravallikavanjarapu57   # owner of the PAT in GHCR_TOKEN
          password: ${{ secrets.GHCR_TOKEN }}

      # Render runs linux/amd64. The runner is amd64 already, so no emulation is needed for the build itself.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy the exact commit's image (not a moving :latest), so Render can't pull a stale cached tag.
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\":\"${IMAGE}:${GITHUB_SHA}\"}")
          code=$(tail -n1 <<<"$resp"); body=$(sed '$d' <<<"$resp")
          echo "Render responded $code: $body"
          [[ "$code" =~ ^2 ]] || { echo "::error::Render deploy trigger failed ($code)"; exit 1; }
          echo "deploy_id=$(jq -r '.id' <<<"$body")" >> "$GITHUB_ENV"

      - name: Wait for the deploy to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            status=$(curl -sS "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.status')
            echo "[$i] deploy status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed) echo "::error::Deploy ended as $status"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for the deploy"; exit 1

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 10 https://eluno-till.onrender.com/api/health
